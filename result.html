<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>角色详情 —— 咒术回战心理诊断</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --card-bg: #14141f;
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #c8a84e;
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,.5);
}

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

.particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(100,50,200,.08) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 80%, rgba(200,50,50,.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(50,100,200,.05) 0%, transparent 50%);
}

.container { max-width: 640px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

/* Header */
.header {
  text-align: center; padding: 40px 16px 30px; position: relative;
}
.header .seal {
  width: 64px; height: 64px; margin: 0 auto 16px;
  border: 2px solid var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  animation: sealPulse 3s ease-in-out infinite;
}
.header .seal span { font-size: 24px; position: relative; z-index: 1; }
@keyframes sealPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(200,168,78,.2); }
  50% { box-shadow: 0 0 40px rgba(200,168,78,.4); }
}
.header h1 {
  font-size: clamp(1.1em, 3.5vw, 1.6em); font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(135deg, #c8a84e, #e8d48b, #c8a84e);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header .subtitle { color: var(--text-dim); margin-top: 8px; font-size: .85em; }

/* Result Card */
.result-section { padding: 10px 0 50px; animation: fadeSlideIn .6s ease; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 32px 20px; text-align: center;
  border: 1px solid rgba(255,255,255,.08);
}

.result-char-img {
  width: 140px; height: 140px; object-fit: cover;
  border-radius: 50%; border: 4px solid;
  margin: 0 auto 12px; display: block;
  background: rgba(255,255,255,.03);
}
.result-emoji {
  font-size: 4.5em; margin-bottom: 12px; display: block;
}
.result-name {
  font-size: 1.8em; font-weight: 900; letter-spacing: 2px; margin-bottom: 2px;
}
.result-from { color: var(--text-dim); font-size: .82em; margin-bottom: 20px; }

.result-desc {
  max-width: 480px; margin: 0 auto 24px; line-height: 1.8;
  color: var(--text-dim); font-size: .88em; text-align: left;
  padding: 0 4px;
}
.result-desc .highlight { color: var(--text); font-weight: 600; }

.result-quote {
  margin: 0 auto 24px; max-width: 440px; padding: 18px 20px;
  background: rgba(200,168,78,.06); border-radius: 12px;
  font-style: italic; font-size: .9em; position: relative;
}
.result-quote::before { content: '"'; font-size: 2.6em; color: var(--accent); position: absolute; top: -10px; left: 10px; opacity: .4; }

/* Dimension Bars */
.dims-section { max-width: 400px; margin: 0 auto 24px; text-align: left; padding: 0 4px; }
.dims-section h4 { text-align: center; color: var(--text-dim); font-weight: 400; font-size: .82em; letter-spacing: 2px; margin-bottom: 14px; }
.dim-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.dim-label { width: 56px; font-size: .75em; color: var(--text-dim); text-align: right; flex-shrink: 0; white-space: nowrap; }
.dim-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,.05); border-radius: 10px; overflow: hidden; }
.dim-bar { height: 100%; border-radius: 10px; transition: width 1s ease .3s; }
.dim-val { width: 84px; font-size: .72em; color: var(--text-dim); text-align: left; flex-shrink: 0; white-space: nowrap; }

/* Trait Analysis */
.trait-section { max-width: 400px; margin: 0 auto 24px; }
.trait-section h4 { text-align: center; color: var(--text-dim); font-weight: 400; font-size: .82em; letter-spacing: 2px; margin-bottom: 14px; }
.trait-card {
  background: rgba(255,255,255,.02); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 8px; text-align: left;
  border-left: 3px solid;
}
.trait-card .trait-title { font-size: .85em; font-weight: 600; margin-bottom: 4px; }
.trait-card .trait-desc { font-size: .76em; color: var(--text-dim); line-height: 1.6; }

/* Buttons */
.btn-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.btn {
  display: inline-block; padding: 14px 28px; border-radius: 50px;
  font-size: .9em; font-weight: 700; cursor: pointer; letter-spacing: 1px;
  font-family: inherit; text-decoration: none; transition: all .3s;
  min-height: 48px; -webkit-appearance: none; border: none;
}
.btn-primary {
  background: var(--accent); color: #000;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(200,168,78,.3); }
.btn-outline {
  border: 1px solid rgba(255,255,255,.15); background: var(--card-bg); color: var(--text);
}
.btn-outline:hover { border-color: var(--accent); background: rgba(200,168,78,.1); }

/* All Characters Nav */
.all-chars-section { max-width: 440px; margin: 24px auto 0; }
.all-chars-section h4 { text-align: center; color: var(--text-dim); font-weight: 400; font-size: .78em; letter-spacing: 2px; margin-bottom: 12px; }
.char-nav-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.char-nav-item {
  display: block; text-align: center; padding: 8px 4px;
  background: rgba(255,255,255,.02); border-radius: 8px;
  text-decoration: none; color: var(--text-dim); font-size: .7em;
  border: 1px solid rgba(255,255,255,.04);
  transition: all .25s;
}
.char-nav-item:hover { border-color: var(--accent); color: var(--text); background: rgba(200,168,78,.08); }
.char-nav-item.active { border-color: var(--accent); color: var(--accent); background: rgba(200,168,78,.1); }
.char-nav-item .nav-emoji { display: block; font-size: 1.4em; margin-bottom: 2px; }
.char-nav-item .nav-name { font-size: .95em; }

/* Error */
.error-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 48px 20px; text-align: center;
  border: 1px solid rgba(255,255,255,.08);
}
.error-card .error-emoji { font-size: 3em; margin-bottom: 12px; }
.error-card h2 { font-size: 1.2em; margin-bottom: 8px; }
.error-card p { color: var(--text-dim); font-size: .88em; margin-bottom: 20px; }

.footer { text-align: center; padding: 30px 16px; color: var(--text-dim); font-size: .75em; }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 10px; }
  .header { padding: 30px 12px 20px; }
  .header .seal { width: 52px; height: 52px; }
  .header .seal span { font-size: 20px; }
  .result-card { padding: 24px 14px; }
  .result-name { font-size: 1.4em; }
  .result-char-img { width: 110px; height: 110px; }
  .result-desc { font-size: .84em; }
  .result-quote { font-size: .85em; padding: 14px 16px; }
  .dim-label { width: 48px; font-size: .7em; }
  .dim-val { width: 72px; font-size: .68em; }
  .char-nav-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .char-nav-item { font-size: .65em; padding: 6px 2px; }
}

@media (max-width: 380px) {
  .container { padding: 8px; }
  .header { padding: 24px 8px 16px; }
  .header .seal { width: 44px; height: 44px; }
  .header .seal span { font-size: 18px; }
  .result-card { padding: 20px 10px; }
  .result-name { font-size: 1.2em; }
  .result-char-img { width: 90px; height: 90px; }
  .result-desc { font-size: .8em; }
  .result-quote { font-size: .8em; padding: 12px 14px; }
  .result-quote::before { font-size: 2em; top: -8px; }
  .char-nav-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .char-nav-item .nav-name { font-size: .8em; }
}
</style>
</head>

<script>

      { title: '极致外向', desc: '五条悟在人群中游刃有余，享受成为焦点，但也习惯独自承担最强者的孤独。他的社交能量来源于与生俱来的自信和碾压级的实力。' },
      { title: '高度理性', desc: '他看似随性不羁，实则拥有极其冷静的判断力。情感不会干扰他的决策——他选择相信自己的学生，是因为理性告诉他"新一代才是未来"。' },

const dimNames = ['社交能量', '感性驱动', '理想主义', '主动性'];
const dimPoles = [
  ['外向', '内向'],
  ['感性', '理性'],
  ['理想', '务实'],
  ['主动', '谨慎']
];
const dimColors = ['#4FC3F7', '#FF8C42', '#7C4DFF', '#FF6E6E'];

function getQueryParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

function renderCharPage(char) {
  const dimsHTML = dimNames.map((name, d) => {
    const val = char.dims[d];
    const color = dimColors[d];
    const leftLabel = dimPoles[d][0];
    const rightLabel = dimPoles[d][1];
    return `
      <div class="dim-row">
        <span class="dim-label" style="color:${color}">${leftLabel}←</span>
        <div class="dim-bar-wrap">
          <div class="dim-bar" style="width:${val}%;background:${color}"></div>
        </div>
        <span class="dim-val">→${rightLabel} ${val}%</span>
      </div>
    `;
  }).join('');

  const traitsHTML = char.traits.map((t, i) => `
    <div class="trait-card" style="border-left-color:${dimColors[i]}">
      <div class="trait-title" style="color:${dimColors[i]}">${dimNames[i]} · ${t.title}</div>
      <div class="trait-desc">${t.desc}</div>
    </div>
  `).join('');

  const allCharsNav = characters.map(c => `
    <a href="result.html?char=${c.id}" class="char-nav-item${c.id === char.id ? ' active' : ''}">
      <span class="nav-emoji">${c.emoji}</span>
      <span class="nav-name">${c.name.slice(0, 2)}</span>
    </a>
  `).join('');

  return `
    <div class="result-card">
      <img class="result-char-img" src="${char.img}" alt="${char.name}"
           style="border-color:${char.color};" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <span class="result-emoji" style="display:none;">${char.emoji}</span>
      <h2 class="result-name" style="color:${char.color}">${char.name}</h2>
      <p class="result-from">${char.jp} · ${char.from}</p>

      <div class="result-desc">${char.desc}</div>
      <div class="result-quote">${char.quote}</div>

      <div class="dims-section">
        <h4>▸ 角色心理维度档案 ▸</h4>
        ${dimsHTML}
      </div>

      <div class="trait-section">
        <h4>▸ 四维特质深度解读 ▸</h4>
        ${traitsHTML}
      </div>

      <div class="btn-row">
        <a href="index.html" class="btn btn-outline">← 返回测试</a>
        <button class="btn btn-primary" onclick="window.location.href='index.html'">去测试看看你像谁</button>
      </div>

      <div class="all-chars-section">
        <h4>▸ 查看其他角色 ▸</h4>
        <div class="char-nav-grid">${allCharsNav}</div>
      </div>
    </div>
  `;
}

function renderError() {
  return `
    <div class="error-card">
      <div class="error-emoji">🔍</div>
      <h2>角色未找到</h2>
      <p>请从测试结果页面选择你的匹配角色。</p>
      <a href="index.html" class="btn btn-primary">返回测试</a>
    </div>
  `;
}

(function init() {
  const charId = getQueryParam('char');
  const char = characters.find(c => c.id === charId);
  const section = document.getElementById('resultSection');
  section.innerHTML = char ? renderCharPage(char) : renderError();
})();
</script>
