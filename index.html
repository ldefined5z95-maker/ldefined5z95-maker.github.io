<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>你是《咒术回战》中的谁？—— 心理诊断测试</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --card-bg: #14141f;
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #c8a84e;
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,.5);
}

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

/* ===== 背景粒子 ===== */
.particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(100,50,200,.08) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 80%, rgba(200,50,50,.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(50,100,200,.05) 0%, transparent 50%);
}

.container { max-width: 900px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

/* ===== Header ===== */
.header {
  text-align: center; padding: 40px 16px 30px; position: relative;
}
.header .seal {
  width: 64px; height: 64px; margin: 0 auto 16px;
  border: 2px solid var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  animation: sealPulse 3s ease-in-out infinite;
}
.header .seal span { font-size: 24px; position: relative; z-index: 1; }
@keyframes sealPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(200,168,78,.2); }
  50% { box-shadow: 0 0 40px rgba(200,168,78,.4); }
}
.header h1 {
  font-size: clamp(1.3em, 4vw, 2.2em); font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(135deg, #c8a84e, #e8d48b, #c8a84e);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header .subtitle { color: var(--text-dim); margin-top: 8px; font-size: .9em; }

/* ===== 人物卡片网格 ===== */
.chars-section { padding: 10px 0 40px; }
.chars-section h2 {
  text-align: center; font-size: 1em; color: var(--text-dim);
  letter-spacing: 3px; margin-bottom: 24px; font-weight: 400;
}
.chars-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.char-card {
  background: var(--card-bg); border-radius: 12px;
  text-align: center; padding: 14px 8px 14px;
  transition: transform .3s, box-shadow .3s, border-color .3s;
  cursor: default; border: 1px solid rgba(255,255,255,.05);
}
.char-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,.6);
  border-color: rgba(200,168,78,.3);
}
.char-emoji {
  font-size: 2.4em; margin-bottom: 8px; display: block;
}
.char-img {
  width: 100%; aspect-ratio: 3/4; object-fit: cover;
  border-radius: 8px; margin-bottom: 8px; display: block;
  background: rgba(255,255,255,.03);
}
.char-card h3 {
  font-size: .9em; letter-spacing: 1px; margin-bottom: 2px;
}
.char-card .jp-name { font-size: .65em; color: var(--text-dim); margin-bottom: 4px; }
.char-card .tagline { font-size: .7em; color: var(--text-dim); padding: 0 4px; }

/* ===== 测试区域 ===== */
.quiz-section { padding: 10px 0 40px; }
.quiz-section h2 {
  text-align: center; font-size: 1em; color: var(--text-dim);
  letter-spacing: 3px; margin-bottom: 24px; font-weight: 400;
}

.progress-wrap {
  margin-bottom: 20px; background: var(--card-bg);
  border-radius: 50px; height: 6px; overflow: hidden;
}
.progress-bar {
  height: 100%; border-radius: 50px;
  background: linear-gradient(90deg, #4FC3F7, #7C4DFF, #FF6E6E, #FF8C42);
  background-size: 300% 100%;
  animation: progressShimmer 2s linear infinite;
  transition: width .5s ease;
  width: 0;
}
@keyframes progressShimmer {
  0% { background-position: 100% 0; }
  100% { background-position: 0 0; }
}
.progress-text {
  text-align: center; font-size: .78em; color: var(--text-dim);
  margin-top: 8px;
}

.question-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 28px 20px; margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,.05);
  display: none; animation: fadeSlideIn .4s ease;
}
.question-card.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.q-num {
  font-size: .72em; color: var(--accent); letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 10px;
}
.q-title {
  font-size: 1.05em; margin-bottom: 18px; line-height: 1.5; font-weight: 600;
}
.q-context {
  font-size: .78em; color: var(--text-dim); font-style: italic;
  margin-bottom: 16px; padding: 8px 12px;
  background: rgba(200,168,78,.05); border-left: 2px solid var(--accent);
  border-radius: 0 8px 8px 0;
}

.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  display: block; width: 100%; text-align: left; padding: 16px 16px;
  border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
  background: rgba(255,255,255,.02); color: var(--text);
  font-size: .93em; cursor: pointer;
  transition: all .25s ease; font-family: inherit;
  -webkit-appearance: none;
  min-height: 52px; /* touch-friendly */
}
.option-btn:hover {
  background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2);
  transform: translateX(4px);
}
.option-btn:active { transform: scale(.98); }
.option-btn .opt-letter {
  display: inline-block; width: 26px; height: 26px;
  line-height: 26px; text-align: center;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
  margin-right: 10px; font-size: .78em; font-weight: 700;
  vertical-align: middle;
}
.option-btn.selected {
  background: rgba(200,168,78,.12); border-color: var(--accent);
}
.option-btn.selected .opt-letter {
  background: var(--accent); color: #000; border-color: var(--accent);
}

/* ===== 导航按钮 ===== */
.quiz-nav { display: none; justify-content: space-between; margin-top: 16px; gap: 8px; }
.quiz-nav.show { display: flex; }
.nav-btn {
  padding: 12px 20px; border-radius: 50px;
  border: 1px solid rgba(255,255,255,.15);
  background: var(--card-bg); color: var(--text);
  font-size: .88em; cursor: pointer; font-family: inherit;
  transition: all .25s; min-height: 48px;
  -webkit-appearance: none;
}
.nav-btn:hover { border-color: var(--accent); background: rgba(200,168,78,.1); }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }

/* ===== 结果页 ===== */
.result-section { display: none; padding: 20px 0 50px; }
.result-section.show { display: block; animation: fadeSlideIn .6s ease; }

.result-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 32px 20px; text-align: center;
  border: 1px solid rgba(255,255,255,.08);
}
.result-emoji {
  font-size: 4em; margin-bottom: 12px; display: block;
}
.result-char-img {
  width: 120px; height: 120px; object-fit: cover;
  border-radius: 50%; border: 4px solid;
  margin: 0 auto 12px; display: block;
  background: rgba(255,255,255,.03);
}
.result-name {
  font-size: 1.6em; font-weight: 900; letter-spacing: 2px; margin-bottom: 2px;
  word-break: keep-all;
}
.result-from { color: var(--text-dim); font-size: .82em; margin-bottom: 14px; }
.result-match {
  display: inline-block; padding: 6px 18px; border-radius: 50px;
  font-size: .85em; font-weight: 700; margin-bottom: 20px;
  letter-spacing: 1px;
}
.result-match.strong { background: rgba(200,168,78,.15); color: #e8d48b; }
.result-match.moderate { background: rgba(255,255,255,.08); color: var(--text-dim); }
.result-match.weak { background: rgba(255,255,255,.05); color: var(--text-dim); }

.result-desc {
  max-width: 520px; margin: 0 auto 24px; line-height: 1.8;
  color: var(--text-dim); font-size: .88em; text-align: left;
  padding: 0 4px;
}
.result-desc .highlight { color: var(--text); font-weight: 600; }

.result-quote {
  margin: 0 auto 24px; max-width: 440px; padding: 18px 20px;
  background: rgba(200,168,78,.06); border-radius: 12px;
  font-style: italic; font-size: .9em; position: relative;
}
.result-quote::before { content: '"'; font-size: 2.6em; color: var(--accent); position: absolute; top: -10px; left: 10px; opacity: .4; }

/* 维度条 */
.dims-section { max-width: 400px; margin: 0 auto 24px; text-align: left; padding: 0 4px; }
.dims-section h4 { text-align: center; color: var(--text-dim); font-weight: 400; font-size: .82em; letter-spacing: 2px; margin-bottom: 14px; }
.dim-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.dim-label { width: 56px; font-size: .75em; color: var(--text-dim); text-align: right; flex-shrink: 0; white-space: nowrap; }
.dim-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,.05); border-radius: 10px; overflow: hidden; }
.dim-bar { height: 100%; border-radius: 10px; transition: width 1s ease .3s; }
.dim-val { width: 52px; font-size: .72em; color: var(--text-dim); text-align: left; flex-shrink: 0; white-space: nowrap; }

/* Top 3 matches */
.top3-section { max-width: 440px; margin: 0 auto 24px; }
.top3-section h4 { text-align: center; color: var(--text-dim); font-weight: 400; font-size: .82em; letter-spacing: 2px; margin-bottom: 10px; }
.top3-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-bottom: 6px;
  background: rgba(255,255,255,.02); border-radius: 10px;
  font-size: .82em; transition: all .25s ease;
}
.top3-row:hover {
  background: rgba(200,168,78,.06);
  transform: translateX(4px);
}
.top3-rank { font-weight: 700; color: var(--accent); width: 22px; text-align: center; }
.top3-emoji { font-size: 1.3em; width: 30px; text-align: center; }
.top3-name { flex: 1; }
.top3-name a {
  color: var(--text); text-decoration: none;
  transition: color .25s; cursor: pointer;
}
.top3-name a:hover { color: var(--accent); text-decoration: underline; }
.top3-pct { color: var(--text-dim); font-size: .82em; }

.retry-btn {
  display: inline-block; margin-top: 6px; padding: 14px 36px;
  background: var(--accent); color: #000; border: none;
  border-radius: 50px; font-size: 1em; font-weight: 700;
  cursor: pointer; letter-spacing: 1px; font-family: inherit;
  transition: all .3s; min-height: 48px;
  -webkit-appearance: none;
}
.retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(200,168,78,.3); }

.footer { text-align: center; padding: 30px 16px; color: var(--text-dim); font-size: .75em; }

/* ===== 响应式：平板 ===== */
@media (max-width: 900px) {
  .chars-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .char-card { padding: 10px 4px 10px; }
  .char-img { aspect-ratio: 3/4; }
  .char-emoji { font-size: 2em; }
  .char-card h3 { font-size: .78em; }
  .char-card .jp-name { font-size: .6em; }
  .char-card .tagline { font-size: .65em; }
}

/* ===== 响应式：手机 ===== */
@media (max-width: 600px) {
  .container { padding: 10px; }
  .header { padding: 30px 12px 20px; }
  .header .seal { width: 52px; height: 52px; }
  .header .seal span { font-size: 20px; }
  .header h1 { font-size: 1.3em; letter-spacing: 2px; }
  .header .subtitle { font-size: .8em; }

  .chars-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .char-card { padding: 10px 6px 10px; }
  .char-img { aspect-ratio: 3/4; }
  .char-emoji { font-size: 2em; }
  .char-card h3 { font-size: .8em; }
  .char-card .jp-name { font-size: .62em; }
  .char-card .tagline { font-size: .68em; }

  .question-card { padding: 22px 14px; }
  .q-title { font-size: .95em; }
  .option-btn { padding: 14px 14px; font-size: .9em; min-height: 48px; }
  .option-btn .opt-letter { width: 24px; height: 24px; line-height: 24px; font-size: .75em; margin-right: 8px; }

  .nav-btn { padding: 10px 16px; font-size: .82em; min-height: 44px; }

  .result-card { padding: 24px 14px; }
  .result-name { font-size: 1.4em; }
  .result-char-img { width: 100px; height: 100px; }
  .result-desc { font-size: .84em; }
  .result-quote { font-size: .85em; padding: 14px 16px; }

  .dims-section { padding: 0; }
  .dim-label { width: 48px; font-size: .7em; }
  .dim-val { width: 48px; font-size: .68em; }
}

/* ===== 响应式：小屏手机 ===== */
@media (max-width: 380px) {
  .container { padding: 8px; }
  .header { padding: 24px 8px 16px; }
  .header .seal { width: 44px; height: 44px; }
  .header .seal span { font-size: 18px; }
  .header h1 { font-size: 1.15em; letter-spacing: 1px; }

  .chars-grid { gap: 6px; }
  .char-card { padding: 8px 4px 8px; border-radius: 8px; }
  .char-img { aspect-ratio: 3/4; }
  .char-emoji { font-size: 1.6em; }
  .char-card h3 { font-size: .72em; }
  .char-card .jp-name { font-size: .58em; }

  .question-card { padding: 18px 12px; border-radius: 12px; }
  .q-title { font-size: .9em; }
  .q-context { font-size: .72em; }
  .option-btn { padding: 12px 12px; font-size: .84em; min-height: 44px; }
  .option-btn .opt-letter { width: 22px; height: 22px; line-height: 22px; font-size: .7em; margin-right: 6px; }

  .nav-btn { padding: 8px 14px; font-size: .78em; min-height: 40px; }

  .result-card { padding: 20px 10px; }
  .result-name { font-size: 1.2em; }
  .result-char-img { width: 80px; height: 80px; }
  .result-desc { font-size: .8em; }
  .result-quote { font-size: .8em; padding: 12px 14px; }
  .result-quote::before { font-size: 2em; top: -8px; }

  .top3-row { font-size: .75em; padding: 8px 10px; }
}
</style>
</head>
<body>

<div class="particles"></div>

<div class="container">

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="seal"><span>呪</span></div>
    <h1>你是《咒术回战》中的谁？</h1>
    <p class="subtitle">—— 咒力检定 · 心理维度诊断测试 ——</p>
  </header>

  <!-- ===== 角色展示 ===== -->
  <section class="chars-section" id="charsSection">
    <h2>▸ 十 位 可 能 的 结 果 ◂</h2>
    <div class="chars-grid" id="charsGrid"></div>
  </section>

  <!-- ===== 测试区 ===== -->
  <section class="quiz-section" id="quizSection">
    <h2>▸ 心 理 诊 断 开 始 ◂</h2>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="progress-text" id="progressText">第 1 / 18 问</p>

    <div id="questionsContainer"></div>

    <div class="quiz-nav show" id="quizNav">
      <button class="nav-btn" id="prevBtn" disabled onclick="prevQuestion()">← 上一题</button>
      <span style="color:var(--text-dim);font-size:.78em;line-height:40px;" id="navHint"></span>
      <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </section>

  <!-- ===== 结果区 ===== -->
  <section class="result-section" id="resultSection">
    <div class="result-card" id="resultCard"></div>
  </section>

  <footer class="footer">
    <p>呪術廻戦 · 非公式粉丝心理诊断 · 仅供娱乐</p>
  </footer>

</div>

<script>
// ============================================================
//  核心数据
// ============================================================

// --- 10个咒术回战角色档案 ---
// 每个角色在4个心理维度上的预设分数 (0-100)
// D1:社交能量(外向→内向) D2:感性驱动(感性→理性)
// D3:理想主义(理想→务实) D4:主动性(主动→谨慎)
const characters = [
  {
    id: 'gojo',
    name: '五条 悟',
    jp: 'Gojo Satoru',
    from: '咒术回战',
    emoji: '👁️',
    img: './image/gojo.jpg',
    color: '#4FC3F7',
    dims: [85, 30, 75, 95],
    desc: `
      <p>你和<span class="highlight">五条悟</span>站在同一高度看世界。</p>
      <p style="margin-top:12px;">你拥有<span class="highlight">碾压级的自信</span>——不是因为傲慢，而是因为你确实有匹配这份自信的实力。你看似玩世不恭、嬉皮笑脸，但内心深藏着改变整个腐朽系统的宏大理想。你讨厌无意义的规则，坚信<span class="highlight">强大不是为了支配，而是为了守护</span>。</p>
      <p style="margin-top:12px;">你重视同伴，尤其关心后辈的成长。关键时刻你总是那个最可靠的支柱。你享受独处的自由，但也不介意成为人群的焦点。</p>
    `,
    quote: '天上天下，唯我独尊。'
  },
  {
    id: 'itadori',
    name: '虎杖 悠仁',
    jp: 'Itadori Yuji',
    from: '咒术回战',
    emoji: '✊',
    img: './image/itadori.jpg',
    color: '#FF6E6E',
    dims: [75, 90, 90, 80],
    desc: `
      <p>你和<span class="highlight">虎杖悠仁</span>拥有同样纯粹的灵魂。</p>
      <p style="margin-top:12px;">你拥有一颗<span class="highlight">温暖而坚定</span>的心。你不一定是最强的那个，但一定是所有人中最不愿放弃的那个。你相信"正确的事"就应该去做，即使代价沉重——你的善良不是软弱，而是你力量的来源。</p>
      <p style="margin-top:12px;">你看重同伴之间的羁绊，愿意为了在乎的人拼尽全力。你追求的"正确的死"，其实是希望<span class="highlight">每个人都能活得有意义</span>。</p>
    `,
    quote: '虽然我不知道自己死亡时会是怎样，但我不想为自己的活法后悔！'
  },
  {
    id: 'megumi',
    name: '伏黑 恵',
    jp: 'Fushiguro Megumi',
    from: '咒术回战',
    emoji: '🌑',
    img: './image/megumi.jpg',
    color: '#7C4DFF',
    dims: [15, 25, 65, 60],
    desc: `
      <p>你和<span class="highlight">伏黑恵</span>是同一种人——沉默但绝不软弱。</p>
      <p style="margin-top:12px;">你冷静、理性，不轻易向他人展露内心。你拥有<span class="highlight">独立的判断力</span>和强烈的个人原则——你不会盲目遵循规则，也不会感情用事地帮助所有人。你会用自己的标准去判断，这很酷，也很孤独。</p>
      <p style="margin-top:12px;">你话不多但行动力极强，习惯独自承担。但那些真正了解你的人知道——在<span class="highlight">最黑暗的时刻</span>，你比任何人都更值得信赖。你身上潜藏着你自己都未察觉的巨大可能性。</p>
    `,
    quote: '唯有不平等的现实平等地存在着，我会不平等地拯救他人。'
  },
  {
    id: 'nobara',
    name: '钉崎 野薔薇',
    jp: 'Kugisaki Nobara',
    from: '咒术回战',
    emoji: '🔨',
    img: './image/nobara.jpg',
    color: '#FF8C42',
    dims: [80, 70, 80, 85],
    desc: `
      <p>你和<span class="highlight">钉崎野薔薇</span>一样——活得真实而炽热。</p>
      <p style="margin-top:12px;">你开朗直率，从不掩饰自己的想法和情绪。你拥有<span class="highlight">钢铁般的内心</span>——外表看起来随性，但你清楚的知道自己是谁、从哪里来、要到哪里去。你不会因为别人的眼光而改变自己。</p>
      <p style="margin-top:12px;">你重视朋友，但绝不依赖朋友。你相信<span class="highlight">真正的强大</span>来自于对自己的忠诚。在关键时刻，你的坚韧会出乎所有人的意料。</p>
    `,
    quote: '我叫钉崎野蔷薇，高兴点小伙子们，一点红来了。'
  },
  {
    id: 'inumaki',
    name: '狗卷 棘',

    options: [
      { letter: 'A', text: '最强的那一个——不，应该说，独一无二的那一个', traits: [ 2, 0, 1, 2] },
      { letter: 'B', text: '一个值得信赖的同伴——和他们一起战斗过的日子就是最好的勋章', traits: [ 1, 0, 1, 0] },
      { letter: 'C', text: '安静地完成了自己使命的人——不需要被铭记，但希望能被理解', traits: [-1, 0,-1,-1] },
      { letter: 'D', text: '无所谓别人怎么记——我活过，做过我觉得对的事，这就够了', traits: [-2, 0,-1,-2] },
    ]
  },
];

// ============================================================
//  状态管理
// ============================================================
let traitScores = [0, 0, 0, 0];  // 4维原始累加分
let currentQ = 0;
let selectedAnswers = new Array(18).fill(null); // 记录每题选中的选项索引

// ============================================================
//  渲染
// ============================================================

// 渲染角色卡片
function renderCharsGrid() {
  const grid = document.getElementById('charsGrid');
  grid.innerHTML = characters.map(c => `
    <div class="char-card">
      <img class="char-img" src="${c.img}" alt="${c.name}" loading="lazy" decoding="async"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <span class="char-emoji" style="display:none;">${c.emoji}</span>
      <h3>${c.name}</h3>
      <p class="jp-name">${c.jp}</p>
      <p class="tagline" style="color:${c.color}">${c.from}</p>
    </div>
  `).join('');
}

// 渲染题目
function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = `question-card${idx === 0 ? ' active' : ''}`;
    card.id = `q-${idx}`;

    card.innerHTML = `
      <div class="q-num">QUESTION ${q.id} / ${questions.length}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-context">${q.context}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <button class="option-btn" data-q="${idx}" data-oi="${oi}">
            <span class="opt-letter">${opt.letter}</span>${opt.text}
          </button>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });

  // 绑定点击事件
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', handleOptionClick);
  });

  updateProgress();
  updateNavButtons();
}

function updateProgress() {
  const total = questions.length;
  const answered = selectedAnswers.filter(a => a !== null).length;
  const pct = Math.round((answered / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    `第 ${Math.min(answered + 1, total)} / ${total} 问`;
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const hint = document.getElementById('navHint');
  const total = questions.length;
  const answered = selectedAnswers.filter(a => a !== null).length;

  prevBtn.disabled = currentQ === 0;
  hint.textContent = `${answered} / ${total} 已答`;

  if (currentQ === total - 1 && answered === total) {
    nextBtn.textContent = '查看结果';
    nextBtn.style.borderColor = 'var(--accent)';
    nextBtn.style.color = 'var(--accent)';
  } else {
    nextBtn.textContent = '下一题 →';
    nextBtn.style.borderColor = 'rgba(255,255,255,.15)';
    nextBtn.style.color = 'var(--text)';
  }
}

// ============================================================
//  交互逻辑
// ============================================================
function handleOptionClick(e) {
  const qIdx = parseInt(e.currentTarget.dataset.q);
  const oi = parseInt(e.currentTarget.dataset.oi);

  // 视觉选中
  const card = document.getElementById(`q-${qIdx}`);
  card.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  e.currentTarget.classList.add('selected');

  // 记录选择
  selectedAnswers[qIdx] = oi;

  // 自动前进到下一题（如果还没答完）
  if (qIdx < questions.length - 1) {
    setTimeout(() => {
      goToQuestion(qIdx + 1);
    }, 350);
  }

  updateProgress();
  updateNavButtons();

  // 如果全部答完，高亮完成状态
  if (selectedAnswers.every(a => a !== null)) {
    document.getElementById('nextBtn').textContent = '查看结果';
    document.getElementById('nextBtn').style.borderColor = 'var(--accent)';
    document.getElementById('nextBtn').style.color = 'var(--accent)';
  }
}

function goToQuestion(idx) {
  if (idx < 0 || idx >= questions.length) return;

  // 隐藏当前
  const currentCard = document.getElementById(`q-${currentQ}`);
  if (currentCard) currentCard.classList.remove('active');

  // 显示目标
  const targetCard = document.getElementById(`q-${idx}`);
  if (targetCard) targetCard.classList.add('active');

  currentQ = idx;
  updateProgress();
  updateNavButtons();

  // 平滑滚动
  document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function prevQuestion() {
  if (currentQ > 0) goToQuestion(currentQ - 1);
}

function nextQuestion() {
  const total = questions.length;
  const answered = selectedAnswers.filter(a => a !== null).length;

  // 如果全部答完且是最后一题，计算并展示结果
  if (currentQ === total - 1 && answered === total) {
    calculateResult();
    return;
  }

  if (currentQ < total - 1) {
    goToQuestion(currentQ + 1);
  }
}

// ============================================================
//  计分 & 匹配
// ============================================================

function calculateResult() {
  // 1. 累加所有选项的维度分
  traitScores = [0, 0, 0, 0];
  selectedAnswers.forEach((oi, qIdx) => {
    if (oi !== null) {
      const vec = questions[qIdx].options[oi].traits;
      for (let d = 0; d < 4; d++) {
        traitScores[d] += vec[d];
      }
    }
  });

  // 2. 归一化到 0-100
  const normalized = traitScores.map((raw, d) => {
    const maxAbs = dimMaxRaw[d];
    return Math.round(((raw + maxAbs) / (2 * maxAbs)) * 100);
  });

  // 3. 计算与每个角色的欧几里得距离 → 匹配度
  const matches = characters.map(char => {
    let sumSq = 0;
    for (let d = 0; d < 4; d++) {
      sumSq += Math.pow(normalized[d] - char.dims[d], 2);
    }
    const dist = Math.sqrt(sumSq);
    const matchPct = Math.max(0, Math.round(100 - dist / 2));
    return { char, dist, matchPct };
  });

  // 按匹配度降序排序
  matches.sort((a, b) => b.matchPct - a.matchPct);

  const best = matches[0];
  const top3 = matches.slice(0, 3);

  // 4. 判断匹配等级
  let matchLevel;
  if (best.matchPct >= 65) {
    matchLevel = 'strong';
  } else if (best.matchPct >= 50) {
    matchLevel = 'moderate';
  } else {
    matchLevel = 'weak';
  }

  // 5. 展示结果
  showResult(best, top3, matchLevel, normalized);
}

function showResult(best, top3, matchLevel, normalized) {
  document.getElementById('quizSection').style.display = 'none';

  const resultSection = document.getElementById('resultSection');
  resultSection.classList.add('show');

  const useUnique = matchLevel === 'weak';
  const result = useUnique ? uniqueSoul : best.char;

  const levelLabels = {
    strong: '高度匹配',
    moderate: '中等匹配',
    weak: '弱匹配'
  };

  const levelClass = matchLevel;

  // 维度条
  const dimsHTML = dimNames.map((name, d) => {
    const val = normalized[d];
    const color = dimColors[d];
    const leftLabel = dimPoles[d][0];
    const rightLabel = dimPoles[d][1];
    return `
      <div class="dim-row">
        <span class="dim-label" style="color:${color}">${leftLabel}←</span>
        <div class="dim-bar-wrap">
          <div class="dim-bar" style="width:${val}%;background:${color}"></div>
        </div>
        <span class="dim-val">→${rightLabel}</span>
      </div>
    `;
  }).join('');

  // Top 3
  const top3HTML = top3.map((m, i) => `
    <div class="top3-row">
      <span class="top3-rank">#${i + 1}</span>
      <span class="top3-emoji">${m.char.emoji}</span>
      <span class="top3-name"><a href="result.html?char=${m.char.id}">${m.char.name}</a></span>
      <span class="top3-pct">${m.matchPct}%</span>
    </div>
  `).join('');

  // 匹配度说明
  let matchNote = '';
  if (matchLevel === 'strong') {
    matchNote = '你的性格特质与这个角色产生了强烈的共鸣，你们在多个维度上高度一致。';
  } else if (matchLevel === 'moderate') {
    matchNote = '你的性格比较多元，以下是综合评分最接近你的角色。你身上可能还混合了其他角色的特质。';
  } else {
    matchNote = '你的性格特质分布非常均衡，没有与任何单一角色形成压倒性匹配。这说明你拥有复杂而独特的人格——这本身就是一种很酷的特质。';
  }

  document.getElementById('resultCard').innerHTML = `
    <img class="result-char-img" src="${result.img || ''}" alt="${result.name}"
         style="border-color:${result.color};"
         loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <span class="result-emoji" style="display:none;">${result.emoji}</span>
    <h2 class="result-name" style="color:${result.color}">${result.name}</h2>
    <p class="result-from">${result.jp}${result.from ? ' · ' + result.from : ''}</p>

    <div class="result-match ${levelClass}">
      ${levelLabels[matchLevel]} · 匹配度 ${best.matchPct}%
    </div>

    <div class="result-desc">${result.desc}</div>

    <div class="result-quote">${result.quote}</div>

    <div class="dims-section">
      <h4>▸ 你的心理维度 ▸</h4>
      ${dimsHTML}
      <p style="text-align:center;font-size:.75em;color:var(--text-dim);margin-top:8px;">
        ${matchNote}
      </p>
    </div>

    <div class="top3-section">
      <h4>▸ 最接近的三个角色 ▸</h4>
      ${top3HTML}
    </div>

    <p style="margin-top:8px;color:var(--text-dim);font-size:.8em;">
      回答了 <strong style="color:var(--accent);">${selectedAnswers.filter(a => a !== null).length}</strong> / ${questions.length} 道题目
    </p>

    <button class="retry-btn" onclick="retry()">再 测 一 次</button>
  `;

  resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retry() {
  traitScores = [0, 0, 0, 0];
  selectedAnswers = new Array(18).fill(null);
  currentQ = 0;

  // 重置UI
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const firstCard = document.getElementById('q-0');
  if (firstCard) firstCard.classList.add('active');

  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('quizSection').style.display = '';
  document.getElementById('nextBtn').textContent = '下一题 →';
  document.getElementById('nextBtn').style.borderColor = 'rgba(255,255,255,.15)';
  document.getElementById('nextBtn').style.color = 'var(--text)';

  updateProgress();
  updateNavButtons();
  document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ============================================================
//  初始化
// ============================================================
renderCharsGrid();
renderQuestions();
</script>
